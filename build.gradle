plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'online.zhaan.smsforwarder'
    compileSdk 34

    defaultConfig {
        applicationId 'online.zhaan.smsforwarder'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['.']
            java.include '*.java'
        }
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.9.1'
}
